<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Suma en JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
    }
    input, button {
      padding: 8px;
      font-size: 16px;
      margin: 5px;
    }
    #resultado {
      color: green;
      font-size: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>Calculadora super epica</h2>

  <input type="number" id="numero1" placeholder="Primer número">
  <span>+</span>
  <input type="number" id="numero2" placeholder="Segundo número">

  <button onclick="realizarSuma()">Calcular Suma</button>

  <div id="resultado">El resultado aparecerá aquí</div>

  <script>
    function realizarSuma() {
      let texto1 = document.getElementById('numero1').value;
      let texto2 = document.getElementById('numero2').value;

      let num1 = Number(texto1);
      let num2 = Number(texto2);

      let total = num1 + num2;

      document.getElementById('resultado').textContent = "El resultado es: " + total;
    }
  </script>

</body>
</html>
